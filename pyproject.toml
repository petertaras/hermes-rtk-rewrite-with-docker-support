[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-rtk-rewrite-with-docker-support"
version = "0.1.0"
description = "Hermes Agent plugin adapter for RTK command rewriting, with Docker and remote backend support"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "RTK Contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
# The plugin is a flat directory package: plugin.yaml + __init__.py at the
# repo root, mirroring how it is installed into ~/.hermes/plugins/rtk-rewrite/.
py-modules = ["__init__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
